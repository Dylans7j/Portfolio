name: Check article build
on:
  push:
    paths: ['content/**', 'scripts/**', 'articles/**', 'write-ups.html', 'articles.*', 'package*.json', '.github/workflows/check-articles.yml']
  pull_request:
    paths: ['content/**', 'scripts/**', 'articles/**', 'write-ups.html', 'articles.*', 'package*.json', '.github/workflows/check-articles.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: node --check app.js && node --check articles.js
      - name: Check committed output matches the reviewed source
        run: git diff --exit-code
